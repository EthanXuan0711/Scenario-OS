<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ScenarioOS · 个人决策大脑</title>
<style>
  :root{
    --bg:#030308; --bg-main:#040409; --panel:#07070e; --panel-2:#0a0a12;
    --line:rgba(63,63,70,.6); --line-soft:rgba(39,39,42,.55);
    --txt:#a1a1aa; --txt-strong:#e4e4e7; --txt-50:#fafafa; --txt-dim:#71717a; --txt-dimmer:#52525b;
    --amber:#f59e0b; --amber-soft:#fcd34d; --amber-200:#fde68a; --green:#10b981; --red:#b91c1c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg); color:var(--txt); line-height:1.6;
    font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(245,158,11,.3); color:var(--amber-200)}
  *{scrollbar-width:thin; scrollbar-color:rgba(113,113,122,.6) rgba(24,24,27,.6)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(113,113,122,.45);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(113,113,122,.7)}
  h1,h2,h3,h4{color:var(--txt-50);font-weight:500;letter-spacing:-.01em;margin:0}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  input,textarea{font:inherit;color:inherit}
  a{color:inherit}

  .app{display:flex;height:100vh;height:100dvh;width:100%;overflow:hidden}

  /* ---------- 左栏 Vault ---------- */
  .vault{width:21rem;min-width:19rem;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line-soft);z-index:20}
  .vault-head{padding:12px 16px;border-bottom:1px solid var(--line-soft)}
  .vault-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .vault-title .l{display:flex;align-items:center;gap:8px;color:var(--txt-strong);font-weight:500}
  .muted{color:var(--txt-dim);font-size:12px}
  .search{display:flex;align-items:center;gap:8px;border:1px solid #27272a;background:var(--panel-2);padding:8px 12px}
  .search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--txt-strong);font-size:13px}
  .search input::placeholder{color:var(--txt-dimmer)}
  .vault-scroll{flex:1;overflow-y:auto;padding:16px 12px}
  .grp-label{display:flex;align-items:center;gap:8px;padding:0 4px;margin-bottom:8px;font-size:12px;font-weight:500;color:var(--txt-dim)}
  .moc-btn{display:block;width:100%;text-align:left;border:1px solid #18181b;padding:8px 12px;margin-bottom:8px;transition:.15s}
  .moc-btn:hover{border-color:#3f3f46}
  .moc-btn.active{border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.1)}
  .moc-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .moc-row .nm{font-size:12px;color:#e4e4e7}
  .moc-row .sc{font-size:12px;color:var(--amber-200)}
  .bar{height:4px;background:#18181b;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:rgba(245,158,11,.75)}
  .note-btn{display:block;width:100%;text-align:left;padding:8px;transition:.15s;color:var(--txt-dim)}
  .note-btn:hover{background:rgba(39,39,42,.5);color:#e4e4e7}
  .note-btn.active{background:#18181b;color:var(--amber-200)}
  .note-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .note-row .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note-row .ty{font-size:10px;color:var(--txt-dimmer);flex:none}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{border:1px solid #18181b;padding:4px 8px;font-size:12px;color:var(--txt-dim);transition:.15s}
  .tag:hover{border-color:rgba(245,158,11,.4);color:var(--amber-200)}
  .sec{margin-bottom:20px}
  .vault-foot{border-top:1px solid var(--line-soft);padding:16px;display:flex;flex-direction:column;gap:12px}
  .inbox-row{display:flex;gap:8px}
  .inbox-row input{flex:1;min-width:0;border:1px solid #27272a;background:#18181b;padding:8px 12px;outline:none;color:var(--txt-strong);font-size:13px}
  .inbox-row input:focus{border-color:rgba(245,158,11,.5)}
  .inbox-row input::placeholder{color:var(--txt-dimmer)}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;background:#f4f4f5;color:#09090b;padding:0 12px;transition:.15s}
  .icon-btn:hover{background:#fff}
  .ghost{border:1px solid #27272a;padding:8px;font-size:12px;color:var(--txt-dim);text-align:left;transition:.15s}
  .ghost:hover{border-color:rgba(245,158,11,.4);color:var(--amber-200)}
  .ghost.center{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}

  /* ---------- 中栏 Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-main)}
  .main-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line-soft);padding:12px 16px}
  .crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt-dim);margin-bottom:4px}
  .main-title{font-size:18px;color:var(--txt-50);max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modes{display:flex;gap:8px;overflow-x:auto}
  .mode-btn{flex:none;border:1px solid #27272a;padding:6px 12px;font-size:12px;color:var(--txt-dim);transition:.15s}
  .mode-btn:hover{color:#e4e4e7}
  .mode-btn.active{border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.1);color:var(--amber-200)}
  .main-body{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
  .stage{position:absolute;inset:0}
  .stage canvas{display:block}
  .graph-mount{position:absolute;inset:0;cursor:crosshair}
  .ov{position:absolute;z-index:10}
  .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #27272a;background:rgba(9,9,11,.8);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;font-size:12px;color:var(--txt)}
  .dot{width:6px;height:6px;border-radius:999px;background:var(--amber)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .dot.live{animation:pulse 2s ease-in-out infinite}
  .info{left:20px;top:20px}
  .status{right:20px;top:20px;display:grid;gap:8px;text-align:right}
  .status .pill .v{color:var(--txt-50)}
  .dossier{left:16px;right:16px;bottom:16px;border:1px solid #27272a;background:rgba(9,9,11,.9);backdrop-filter:blur(8px);padding:16px}
  .dossier h3{display:inline;font-size:14px;color:#e4e4e7}
  .dossier .d-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .dossier p{font-size:12px;color:var(--txt);margin:0 0 12px}
  .pill-tags{display:flex;flex-wrap:wrap;gap:8px}
  .pill-tag{border:1px solid #27272a;padding:4px 8px;font-size:11px;color:var(--txt-dim)}
  @media (min-width:1024px){.dossier{right:auto;max-width:34rem}}
  .overlay{position:absolute;inset:0;z-index:20;overflow-y:auto;background:var(--bg);padding:24px 20px}
  .overlay[hidden]{display:none}
  .article{max-width:46rem;margin:0 auto}
  .md-block{margin-bottom:26px;border-left:1px solid #27272a;padding-left:20px}
  .md-block h3{font-size:14px;color:#e4e4e7;margin-bottom:12px}
  .md-block .body{font-size:14px;color:var(--txt)}
  pre{white-space:pre-wrap;font-size:12px;color:var(--txt-dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:0}
  .linkchip{display:inline-block;border:1px solid #27272a;padding:4px 8px;font-size:12px;color:rgba(253,230,138,.8);margin:0 6px 6px 0;transition:.15s}
  .linkchip:hover{border-color:rgba(245,158,11,.5)}
  .card{border:1px solid #27272a;background:var(--panel-2);padding:20px}
  .grid2{display:grid;gap:16px}
  @media (min-width:1100px){.grid2.canvas-grid{grid-template-columns:1fr .9fr}}
  .path-grid{display:grid;gap:12px}
  @media (min-width:640px){.path-grid{grid-template-columns:1fr 1fr}}
  .path-card{border:1px solid #18181b;background:#0a0a12;padding:16px;text-align:left;transition:.15s;min-height:9rem}
  .path-card:hover{border-color:#3f3f46}
  .path-card.active{border-color:rgba(245,158,11,.6);background:rgba(245,158,11,.1)}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .clip3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .detail .k{font-size:12px;color:var(--txt-dimmer);margin-bottom:4px}
  .detail .v{font-size:14px;color:var(--txt-strong)}
  .tl{border-left:2px solid #27272a;padding-left:16px;margin-bottom:12px}
  .tl .t{font-size:12px;color:rgba(253,230,138,.8);margin-bottom:2px}
  .btn-solid{display:inline-flex;align-items:center;gap:8px;background:#f4f4f5;color:#09090b;font-weight:500;padding:8px 12px;font-size:12px;transition:.15s}
  .btn-solid:hover{background:#fff}
  .main-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line-soft);padding:8px 16px;font-size:12px;color:var(--txt-dimmer)}

  /* ---------- 右栏 Aside ---------- */
  .aside{width:27rem;min-width:23rem;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line-soft);z-index:20}
  .tabbar{display:flex;overflow-x:auto;border-bottom:1px solid var(--line-soft);padding:8px 8px 0;font-size:12px;font-weight:500}
  .tab{flex:none;border-bottom:2px solid transparent;padding:8px 12px;color:var(--txt-dim);transition:.15s}
  .tab:hover{color:#d4d4d8}
  .tab.active{border-color:var(--amber);color:var(--txt-50)}
  .tab-body{flex:1;overflow-y:auto;padding:0 20px}
  .psec{padding:20px 0;border-bottom:1px solid rgba(39,39,42,.5)}
  .psec:last-child{border-bottom:none}
  .psec-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .psec-h h3{font-size:16px;color:#e4e4e7}
  .kv{margin-bottom:12px}
  .metric{margin:8px 0}
  .metric .top{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:4px}
  .metric .top .v{color:var(--txt-50);font-weight:500}
  .bar.round{border-radius:999px}
  .bar.green > i{background:#047857}
  .slider{display:block;padding:16px 0;border-bottom:1px solid #18181b}
  .slider:last-child{border-bottom:none}
  .slider .lab{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:8px}
  .slider .lab .v{color:var(--txt-50)}
  .slider input[type=range]{width:100%;accent-color:var(--amber)}
  .slider .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--txt-dimmer);margin-top:4px}
  .council-item{border-left:2px solid #27272a;padding-left:16px;margin-bottom:16px}
  .council-item .stance{font-size:12px;color:rgba(253,230,138,.8);margin:4px 0}
  .protocol-li{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
  .chk{margin-top:2px;flex:none;width:16px;height:16px;border:1px solid #3f3f46;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
  .chk.on{border-color:var(--amber);background:var(--amber);color:#09090b}
  .strike{color:var(--txt-dim);text-decoration:line-through}
  textarea.backfill{width:100%;min-height:6rem;resize:none;border:1px solid #27272a;background:#18181b;padding:8px 12px;font-size:14px;color:var(--txt-strong);outline:none}
  textarea.backfill:focus{border-color:rgba(245,158,11,.5)}
  .lnk-card{display:block;width:100%;text-align:left;border:1px solid #18181b;padding:8px 12px;margin-bottom:12px;transition:.15s}
  .lnk-card:hover{border-color:#3f3f46}
  .dashed{border:1px dashed #27272a;padding:12px;text-align:left;width:100%;font-size:12px;color:var(--txt-dim);transition:.15s}
  .dashed:hover{border-color:rgba(245,158,11,.4);color:var(--amber-200)}
  .small{font-size:12px}
  .xs{font-size:11px}
  .stack{display:flex;flex-direction:column;gap:12px}
  .amber{color:var(--amber)}
  .fallback{height:100%;overflow-y:auto;background:var(--bg);padding:20px}
  .fallback .shell-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-dimmer);margin:0 0 8px}
  .chip{border:1px solid #27272a;padding:6px 12px;border-radius:999px;font-size:12px;color:var(--txt-dim);transition:.15s}
  .chip:hover{border-color:#52525b;color:#e4e4e7}
  .chip.active{border-color:var(--amber);background:rgba(245,158,11,.15);color:var(--amber-200)}
  .chip.hl{border-color:rgba(245,158,11,.5);color:rgba(253,230,138,.8)}

  @media (max-width:1023px){
    .app{flex-direction:column}
    .vault{width:100%;min-width:0;height:34vh;border-right:none;border-bottom:1px solid var(--line-soft)}
    .aside{width:100%;min-width:0;height:40vh;border-left:none;border-top:1px solid var(--line-soft)}
    .main{flex:1;min-height:42vh}
    .main-title{max-width:60vw}
  }
</style>
<script type="importmap">

</script>
</head>
<body>
  <div class="app" id="app">
    <section class="vault">
      <div class="vault-head">
        <div class="vault-title">
          <span class="l"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="amber"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-3H5a2 2 0 0 0-2 2z"/></svg>ScenarioOS Vault</span>
          <span class="muted" id="noteCount"></span>
        </div>
        <label class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--txt-dim)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" type="text" placeholder="搜索笔记、标签或链接..." autocomplete="off" />
        </label>
      </div>
      <div class="vault-scroll" id="vaultScroll"></div>
      <form class="vault-foot" id="captureForm">
        <div class="muted">Inbox / 原子笔记</div>
        <div class="inbox-row">
          <input id="captureInput" type="text" placeholder="写入一个事实、担忧或反驳..." autocomplete="off" />
          <button class="icon-btn" type="submit" aria-label="新建原子笔记"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <div class="stack" id="quickReplies"></div>
        <button type="button" class="ghost center" data-act="regenerate">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
          重算图谱与 MOC
        </button>
      </form>
    </section>

    <main class="main">
      <header class="main-head" id="mainHead"></header>
      <div class="main-body">
        <div class="stage" id="stage">
          <div class="graph-mount" id="graphMount"></div>
          <div class="ov info pill" id="graphInfo"><span class="dot live"></span><span id="graphInfoText"></span></div>
          <div class="ov status" id="graphStatus"></div>
          <div class="ov dossier" id="graphDossier"></div>
        </div>
        <div class="overlay" id="notePanel" hidden></div>
        <div class="overlay" id="canvasPanel" hidden></div>
      </div>
      <footer class="main-foot" id="mainFoot"></footer>
    </main>

    <aside class="aside">
      <div class="tabbar" id="tabbar"></div>
      <div class="tab-body" id="rightBody"></div>
    </aside>
  </div>

<script type="module">
/* ===================== 数据契约（移植自 scenarioOS.ts） ===================== */
const graphNodes = [
  { id:"choice", type:"choice", label:"转行 AI", shell:0, weight:96, confidence:"high", explanation:"当前核心抉择。它会同时改写现金流、成长曲线、身份认同和关键关系。" },
  { id:"self", type:"self", label:"我", shell:0, weight:88, confidence:"high", explanation:"决策者本人。系统只做推演与验证设计，不替你做最终选择。" },
  { id:"company", type:"organization", label:"现公司", shell:1, weight:68, confidence:"medium", explanation:"稳定收入来源，也是当前成长速度放缓的主要环境。" },
  { id:"partner", type:"person", label:"合伙人", shell:1, weight:62, confidence:"medium", explanation:"可能提供技术或项目互补，但协作承诺尚未被现实压力测试。" },
  { id:"family", type:"person", label:"家人", shell:1, weight:58, confidence:"medium", explanation:"偏好稳定，对激进转型的接受度取决于可见的现金流缓冲。" },
  { id:"mentor", type:"person", label:"行业导师", shell:1, weight:52, confidence:"low", explanation:"外部校准者。当前证据不足，适合通过访谈补齐。" },
  { id:"cashflow", type:"value", label:"现金流", shell:2, weight:86, confidence:"high", explanation:"决定转型速度的硬约束。储备不足会把高潜力路径变成被迫止损。" },
  { id:"freedom", type:"value", label:"自由度", shell:2, weight:74, confidence:"medium", explanation:"你对自主选择和工作方式弹性的偏好较强，会抬高创业或独立项目的吸引力。" },
  { id:"growth", type:"value", label:"成长速度", shell:2, weight:82, confidence:"high", explanation:"当前岗位成长曲线趋缓，是你考虑切换赛道的主驱动力。" },
  { id:"identity", type:"value", label:"身份一致性", shell:2, weight:65, confidence:"medium", explanation:"这条路是否像你真正想成为的人，比短期标签更重要。" },
  { id:"risk-cash", type:"risk", label:"现金流断裂", shell:3, weight:80, confidence:"high", explanation:"如果全职转型前没有缓冲，失败会从职业问题扩散成生活压力。" },
  { id:"risk-window", type:"risk", label:"错过窗口", shell:3, weight:67, confidence:"medium", explanation:"等待太久会降低进入新赛道的相对优势，但这个判断需要用真实机会反馈验证。" },
  { id:"risk-focus", type:"risk", label:"精力分散", shell:3, weight:72, confidence:"medium", explanation:"兼顾主业与副业时，最常见失败模式不是能力不足，而是上下文切换耗尽。" },
  { id:"risk-relation", type:"risk", label:"关系张力", shell:3, weight:54, confidence:"low", explanation:"家人、合伙人与现团队的预期管理不足，会把职业选择转化成关系冲突。" },
  { id:"path-steady", type:"path", label:"稳健路径", shell:4, weight:76, confidence:"high", explanation:"保留主业现金流，用 90 天建立可展示项目和行业反馈。" },
  { id:"path-bold", type:"path", label:"冒险路径", shell:4, weight:59, confidence:"medium", explanation:"全职转型，把学习、作品集和商业验证压缩到 6 个月内。" },
  { id:"path-hybrid", type:"path", label:"混合路径", shell:4, weight:84, confidence:"high", explanation:"争取公司内部 AI 项目或 80/20 时间，同时运营个人项目。" },
  { id:"path-retreat", type:"path", label:"止损路径", shell:4, weight:45, confidence:"low", explanation:"暂缓转型，把当前赛道做到更深，用行业深度替代技术广度。" }
];
const graphEdges = [
  { source:"choice", target:"company", relation:"influences", strength:0.74, explanation:"转型改变现公司中的角色和谈判空间。" },
  { source:"choice", target:"partner", relation:"supports", strength:0.62, explanation:"合伙人可能支持副业项目验证。" },
  { source:"choice", target:"family", relation:"constrains", strength:0.58, explanation:"家庭稳定预期会约束激进方案。" },
  { source:"choice", target:"cashflow", relation:"constrains", strength:0.86, explanation:"现金流决定可承受试错周期。" },
  { source:"choice", target:"growth", relation:"triggers", strength:0.83, explanation:"转型的核心诱因是成长速度。" },
  { source:"choice", target:"freedom", relation:"supports", strength:0.74, explanation:"AI 产品化路径更接近自主工作偏好。" },

/* ===================== 计算 ===================== */
const clamp=(v,min=0,max=100)=>Math.max(min,Math.min(max,v));
const allNodes=()=>[...graphNodes,...state.customNodes];
const allEdges=()=>[...graphEdges,...state.customEdges];
function scorePath(p,v){
  const d={
    hybrid:(v.growth-50)*0.12+(v.identity-50)*0.1+(v.cashflow-50)*0.08-(v.risk-50)*0.03-(v.relationship-50)*0.02,
    steady:(v.cashflow-50)*0.16+(v.relationship-50)*0.1-(v.growth-50)*0.06-(v.freedom-50)*0.06-(v.risk-50)*0.04,
    bold:(v.risk-50)*0.16+(v.freedom-50)*0.14+(v.growth-50)*0.11-(v.cashflow-50)*0.13-(v.relationship-50)*0.06,
    retreat:(v.cashflow-50)*0.08+(v.relationship-50)*0.08-(v.growth-50)*0.12-(v.freedom-50)*0.09-(v.identity-50)*0.04
  };
  return clamp(Math.round(p.fitScore+d[p.id]),18,96);
}
const scoredPaths=()=>scenarioPaths.map(p=>({...p,adjustedScore:scorePath(p,state.variables)})).sort((a,b)=>b.adjustedScore-a.adjustedScore);
const activePath=()=>{const s=scoredPaths();return s.find(p=>p.id===state.activePathId)||s[0];};
const selectedNode=()=>allNodes().find(n=>n.id===state.selectedNodeId)||allNodes()[0];
const survival=()=>clamp(Math.round(48+state.variables.cashflow*0.26+state.variables.relationship*0.08-state.variables.risk*0.1),18,94);
const actionReadiness=()=>clamp(Math.round((state.checked.size/actionProtocol.length)*46+(state.committed?24:0)+(state.backfill.trim()?18:0)+state.round*2),0,98);
function relatedEdges(id){return allEdges().filter(e=>e.source===id||e.target===id);}
function backlinkEdges(id){return allEdges().filter(e=>e.target===id);}
function outgoingEdges(id){return allEdges().filter(e=>e.source===id);}
function linkedNodeIds(id){return Array.from(new Set(relatedEdges(id).flatMap(e=>[e.source,e.target])));}
function noteTags(n){const b=[nodeTypeLabels[n.type],confidenceLabels[n.confidence]];if(n.type==="path")b.push("MOC");if(n.type==="risk")b.push("待验证");if(n.type==="value")b.push("变量");return b;}
function filteredNodes(){const q=state.query.trim().toLowerCase();if(!q)return allNodes();return allNodes().filter(n=>`${n.label} ${n.explanation} ${n.type} ${noteTags(n).join(" ")}`.toLowerCase().includes(q));}

  const v=els.captureInput.value.trim(); if(!v){els.captureInput.focus();return;}

  const node={id,type:"evidence",label:v.length>18?v.slice(0,18)+"...":v,shell:2,weight:46,confidence:"low",explanation:v};
  const edge={source:state.selectedNodeId,target:id,relation:"revises",strength:0.48,explanation:`这条原子笔记会修正 ${selectedNode().label} 的判断。`};
  state.customNodes.push(node); state.customEdges.push(edge);

  state.selectedNodeId=id; state.rightTab="properties"; state.mode="note"; state.round++;
  state.lastAction=`已新建 ${wiki(node.label)}，并与 ${wiki(prevLabel)} 建立修正链接。`;

}

/* ===================== 3D 深空螺旋星系 ===================== */
let graph=null;
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function buildPositions(THREE,nodes){
  const counts=new Map(), seen=new Map();
  nodes.forEach(n=>counts.set(n.shell,(counts.get(n.shell)||0)+1));
  return nodes.map(n=>{
    const idx=seen.get(n.shell)||0, c=counts.get(n.shell)||1; seen.set(n.shell,idx+1);
    if(n.shell===0){ const off=n.type==="self"?0.58:-0.58; return {...n,position:new THREE.Vector3(off,0,0)}; }
    const r=1.05+n.shell*0.92, ang=(idx/c)*Math.PI*2+n.shell*0.48, y=Math.sin(ang*1.7+n.shell)*(0.45+n.shell*0.2);
    return {...n,position:new THREE.Vector3(Math.cos(ang)*r,y,Math.sin(ang)*r)};
  });
}

function createGraph(THREE, mount, onSelect){
  const nodeColors={action:"#a1a1aa",choice:"#f59e0b",evidence:"#71717a",organization:"#a1a1aa",path:"#d97706",person:"#d4d4d8",risk:"#b91c1c",self:"#fbbf24",value:"#10b981"};
  const SEL="#fde68a", HL="#f59e0b";
  let W=Math.max(1,mount.clientWidth), H=Math.max(1,mount.clientHeight);
  const scene=new THREE.Scene();
  scene.background=new THREE.Color("#030308");
  scene.fog=new THREE.FogExp2("#030308",0.015);
  const camera=new THREE.PerspectiveCamera(56,W/H,0.1,1000);
  camera.position.set(0,0.5,8.6); camera.lookAt(0,0,0);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.setSize(W,H);
  mount.appendChild(renderer.domElement);

  // 螺旋星系
  const GP={count:6500,size:0.085,radius:16,branches:3,spin:1.05,randomness:0.55,pow:3};
  const gGeo=new THREE.BufferGeometry();
  const gPos=new Float32Array(GP.count*3), gCol=new Float32Array(GP.count*3);
  const cIn=new THREE.Color("#f59e0b"), cOut=new THREE.Color("#312e81");
  for(let i=0;i<GP.count;i++){const i3=i*3;const r=Math.random()*GP.radius;const sa=r*GP.spin;const ba=((i%GP.branches)/GP.branches)*Math.PI*2;
    const sg=()=>Math.random()<0.5?1:-1;
    const rx=Math.pow(Math.random(),GP.pow)*sg()*GP.randomness*r, ry=Math.pow(Math.random(),GP.pow)*sg()*GP.randomness*r, rz=Math.pow(Math.random(),GP.pow)*sg()*GP.randomness*r;
    gPos[i3]=Math.cos(ba+sa)*r+rx; gPos[i3+1]=ry*0.18; gPos[i3+2]=Math.sin(ba+sa)*r+rz;
    const m=cIn.clone().lerp(cOut,r/GP.radius); gCol[i3]=m.r; gCol[i3+1]=m.g; gCol[i3+2]=m.b;
  }
  gGeo.setAttribute("position",new THREE.BufferAttribute(gPos,3));
  gGeo.setAttribute("color",new THREE.BufferAttribute(gCol,3));
  const gMat=new THREE.PointsMaterial({size:GP.size,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true,transparent:true,opacity:0.52});
  const galaxy=new THREE.Points(gGeo,gMat); galaxy.rotation.x=Math.PI*0.2; galaxy.position.y=-1.8; galaxy.renderOrder=-1;
  scene.add(galaxy);
  scene.add(new THREE.AmbientLight("#f4f4f5",0.7));
  const key=new THREE.PointLight("#f59e0b",2.4,28); key.position.set(3.5,4,5); scene.add(key);

  // 图谱组（可重建）
  const group=new THREE.Group(); group.rotation.x=-0.05; scene.add(group);
  let positioned=[], nodeIndex=new Map(), nodeMesh, glowMesh, baseLines, hlGeo, hlSeg, halo, rings=[];
  let targetRX=group.rotation.x, targetRY=0;
  const tmpM=new THREE.Matrix4(), tmpQ=new THREE.Quaternion(), tmpS=new THREE.Vector3(), tmpC=new THREE.Color();
  let styleDirty=true;

  function disposeGraphObjs(){
    [nodeMesh,glowMesh,baseLines,hlSeg,halo].forEach(o=>{ if(o){ group.remove(o); o.geometry&&o.geometry.dispose&&o.geometry.dispose(); o.material&&o.material.dispose&&o.material.dispose(); }});
    rings.forEach(r=>{ group.remove(r); r.geometry.dispose(); r.material.dispose(); }); rings=[];
  }
  function build(nodes,edges){
    disposeGraphObjs();
    positioned=buildPositions(THREE,nodes);
    nodeIndex=new Map(positioned.map((n,i)=>[n.id,{node:n,index:i}]));
    const nGeo=new THREE.SphereGeometry(0.115,22,22);
    nodeMesh=new THREE.InstancedMesh(nGeo,new THREE.MeshBasicMaterial(),positioned.length); nodeMesh.renderOrder=1;
    const glGeo=new THREE.SphereGeometry(0.26,16,16);
    glowMesh=new THREE.InstancedMesh(glGeo,new THREE.MeshBasicMaterial({transparent:true,opacity:0.16,blending:THREE.AdditiveBlending,depthWrite:false}),positioned.length); glowMesh.renderOrder=0;
    positioned.forEach((n,i)=>{
      const s=0.72+n.weight/140; tmpS.set(s,s,s); tmpM.compose(n.position,tmpQ,tmpS); nodeMesh.setMatrixAt(i,tmpM);
      const gs=s*(n.shell===0?1.5:1.2); tmpS.set(gs,gs,gs); tmpM.compose(n.position,tmpQ,tmpS); glowMesh.setMatrixAt(i,tmpM);
    });
    nodeMesh.instanceMatrix.needsUpdate=true; glowMesh.instanceMatrix.needsUpdate=true;
    group.add(glowMesh); group.add(nodeMesh);
    const bp=[]; edges.forEach(e=>{const s=nodeIndex.get(e.source),t=nodeIndex.get(e.target); if(!s||!t)return; bp.push(s.node.position.x,s.node.position.y,s.node.position.z,t.node.position.x,t.node.position.y,t.node.position.z);});
    const bGeo=new THREE.BufferGeometry(); bGeo.setAttribute("position",new THREE.Float32BufferAttribute(bp,3));
    baseLines=new THREE.LineSegments(bGeo,new THREE.LineBasicMaterial({color:"#3f3f46",transparent:true,opacity:0.28})); group.add(baseLines);
    hlGeo=new THREE.BufferGeometry(); hlGeo.setAttribute("position",new THREE.Float32BufferAttribute(new Float32Array(edges.length*6),3));
    hlSeg=new THREE.LineSegments(hlGeo,new THREE.LineBasicMaterial({color:"#fcd34d",transparent:true,opacity:0.7})); hlSeg.renderOrder=2; group.add(hlSeg);
    [1,2,3,4].forEach(sh=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(1.55+sh*1.18,0.004,6,128),new THREE.MeshBasicMaterial({color:"#27272a",transparent:true,opacity:0.32}));ring.rotation.x=Math.PI/2;rings.push(ring);group.add(ring);});
    halo=new THREE.Mesh(new THREE.SphereGeometry(0.3,24,24),new THREE.MeshBasicMaterial({color:"#f59e0b",transparent:true,opacity:0.34,wireframe:true})); halo.renderOrder=3; group.add(halo);
    styleDirty=true;
    curEdges=edges;
  }
  let curEdges=[];
  function applyStyles(){
    const selId=state.selectedNodeId;
    const hi=new Set(linkedNodeIds(selId));
    positioned.forEach((n,i)=>{ const c=n.id===selId?SEL:(hi.has(n.id)?HL:nodeColors[n.type]); nodeMesh.setColorAt(i,tmpC.set(c)); glowMesh.setColorAt(i,tmpC.set(c)); });
    nodeMesh.instanceColor.needsUpdate=true; glowMesh.instanceColor.needsUpdate=true;
    const attr=hlGeo.getAttribute("position"), arr=attr.array; let k=0;
    curEdges.forEach(e=>{ const rel=hi.has(e.source)||hi.has(e.target)||e.source===selId||e.target===selId; if(!rel)return; const s=nodeIndex.get(e.source),t=nodeIndex.get(e.target); if(!s||!t)return; arr[k++]=s.node.position.x;arr[k++]=s.node.position.y;arr[k++]=s.node.position.z;arr[k++]=t.node.position.x;arr[k++]=t.node.position.y;arr[k++]=t.node.position.z; });
    hlGeo.setDrawRange(0,k/3); attr.needsUpdate=true;
  }

  build(allNodes(),allEdges());

  // 指针交互
  const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
  let dragging=false,lastX=0,lastY=0,dist=0;
  const setPtr=e=>{const r=renderer.domElement.getBoundingClientRect();ptr.x=((e.clientX-r.left)/r.width)*2-1;ptr.y=-(((e.clientY-r.top)/r.height)*2-1);};
  const down=e=>{dragging=true;dist=0;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);};
  const move=e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;dist+=Math.abs(dx)+Math.abs(dy);targetRY+=dx*0.004;targetRX=Math.max(-0.78,Math.min(0.42,targetRX+dy*0.0025));lastX=e.clientX;lastY=e.clientY;};
  const up=e=>{if(renderer.domElement.hasPointerCapture(e.pointerId))renderer.domElement.releasePointerCapture(e.pointerId);dragging=false;if(dist>8)return;setPtr(e);ray.setFromCamera(ptr,camera);const hit=ray.intersectObject(nodeMesh)[0];if(hit&&typeof hit.instanceId==="number"&&positioned[hit.instanceId])onSelect(positioned[hit.instanceId].id);};
  const wheel=e=>{e.preventDefault();camera.position.z=Math.max(5.6,Math.min(13,camera.position.z+e.deltaY*0.005));};
  renderer.domElement.addEventListener("pointerdown",down);
  renderer.domElement.addEventListener("pointermove",move);
  renderer.domElement.addEventListener("pointerup",up);
  renderer.domElement.addEventListener("pointercancel",up);
  renderer.domElement.addEventListener("wheel",wheel,{passive:false});

  let paused=false, raf=0; const clock=new THREE.Clock();
  function loop(){
    raf=requestAnimationFrame(loop);
    if(paused)return;
    if(styleDirty){applyStyles();styleDirty=false;}
    const t=clock.getElapsedTime();
    if(!reduceMotion){ targetRY+=0.0008; galaxy.rotation.y=t*0.02; rings.forEach(r=>r.rotation.z+=0.0007); }
    group.rotation.y+=(targetRY-group.rotation.y)*0.06;
    group.rotation.x+=(targetRX-group.rotation.x)*0.06;
    const sel=nodeIndex.get(state.selectedNodeId);
    if(sel){halo.visible=true;halo.position.copy(sel.node.position);halo.scale.setScalar(reduceMotion?1.04:1+Math.sin(t*4)*0.11);}else halo.visible=false;
    renderer.render(scene,camera);
  }
  loop();

  function resize(){W=Math.max(1,mount.clientWidth);H=Math.max(1,mount.clientHeight);camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);}
  window.addEventListener("resize",resize);
  let ro; if(typeof ResizeObserver!=="undefined"){ro=new ResizeObserver(resize);ro.observe(mount);}

  return {
    sync(){styleDirty=true;},
    resize,
    rebuild(){build(allNodes(),allEdges());},
    setPaused(p){paused=p;},
    dispose(){cancelAnimationFrame(raf);window.removeEventListener("resize",resize);ro&&ro.disconnect();disposeGraphObjs();gGeo.dispose();gMat.dispose();renderer.dispose();if(mount.contains(renderer.domElement))mount.removeChild(renderer.domElement);}
  };
}

function renderFallback(){
  const sel=state.selectedNodeId, hi=new Set(linkedNodeIds(sel));
  const shells=[...new Set(allNodes().map(n=>n.shell))].sort((a,b)=>a-b);
  els.graphMount.innerHTML=`<div class="fallback">
    <div class="pill" style="margin-bottom:16px"><span class="dot"></span>2D 图谱视图（当前环境未启用 WebGL）· ${allNodes().length} 节点 / ${allEdges().length} 链接</div>
    ${shells.map(sh=>`<div style="margin-bottom:20px"><p class="shell-label">Shell ${sh}</p><div class="tags">${allNodes().filter(n=>n.shell===sh).map(n=>`<button class="chip ${n.id===sel?"active":(hi.has(n.id)?"hl":"")}" data-act="selectNote" data-id="${esc(n.id)}">${wiki(esc(n.label))} <span style="color:var(--txt-dimmer);font-size:10px">${nodeTypeLabels[n.type]}</span></button>`).join("")}</div></div>`).join("")}
  </div>`;
}

/* ===================== 启动 ===================== */
renderVaultStatic();
renderAll();

(async ()=>{
  let THREE=null;
  try{ THREE=await import("three"); }catch(err){ console.warn("Three.js 加载失败，使用 2D 降级视图：",err); }
  if(THREE && (function(){try{const c=document.createElement("canvas");return !!(window.WebGLRenderingContext&&(c.getContext("webgl")||c.getContext("experimental-webgl")));}catch(e){return false;}})()){
    try{
      graph=createGraph(THREE.default?THREE.default:THREE, els.graphMount, selectNode);
      // 用命名空间或 default 兼容
      graph.sync(); applyMode();
    }catch(err){ console.warn("3D 初始化失败，使用 2D 降级视图：",err); graph=null; renderFallback(); }
  } else {
    renderFallback();
  }
})();
</script>
